name: Windows Server 2022 — Long Session
run-name: "Windows Server 2022 SSH + VNC • ${{ inputs.session_minutes || 350 }} minutes"

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Session length in minutes (maximum 350; job timeout is 360 minutes)
        required: true
        type: number
        default: 350
      heartbeat_minutes:
        description: Write a heartbeat every N minutes
        required: true
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "15"
        default: "5"

permissions:
  contents: read

concurrency:
  group: windows-server-2022-long-session
  cancel-in-progress: true

jobs:
  windows-session:
    name: Windows Server 2022 with private SSH and VNC
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      SESSION_MINUTES: ${{ inputs.session_minutes || 350 }}
      HEARTBEAT_MINUTES: ${{ inputs.heartbeat_minutes || 5 }}

    steps:
      - name: Validate remote-access secrets
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          REMOTE_PASSWORD: ${{ secrets.REMOTE_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { $missing += 'TAILSCALE_AUTHKEY' }
          if ([string]::IsNullOrWhiteSpace($env:REMOTE_PASSWORD)) { $missing += 'REMOTE_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) { $missing += 'VNC_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Configure these repository Actions secrets first: $($missing -join ', '). See README section 'Windows Server 2022 SSH + VNC access'. Secret values are never printed."
          }
          if ($env:REMOTE_PASSWORD.Length -lt 14) { throw 'REMOTE_PASSWORD must be at least 14 characters long.' }
          if ($env:VNC_PASSWORD -notmatch '^[A-Za-z0-9]{8}$') {
            throw 'VNC_PASSWORD must be exactly 8 ASCII letters/digits.'
          }
          Write-Host 'Required secrets are present; password formats are valid.'

      - name: Identify the Windows host
        id: host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDir = Join-Path $env:RUNNER_TEMP 'windows-2022-session'
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          "REPORT_DIR=$reportDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $memoryGiB = [Math]::Round($computer.TotalPhysicalMemory / 1GB, 2)
          $disks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
              @{Name='SizeGiB';Expression={[Math]::Round($_.Size / 1GB, 1)}},
              @{Name='FreeGiB';Expression={[Math]::Round($_.FreeSpace / 1GB, 1)}}

          $report = @(
            'Windows Server 2022 hosted runner session'
            "UTC start: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ssZ'))"
            "Computer: $env:COMPUTERNAME"
            "OS: $($os.Caption)"
            "Version/build: $($os.Version) / $($os.BuildNumber)"
            "Boot time: $($os.LastBootUpTime)"
            "Architecture: $env:PROCESSOR_ARCHITECTURE"
            "CPU: $($cpu.Name)"
            "Logical processors: $($computer.NumberOfLogicalProcessors)"
            "Memory GiB: $memoryGiB"
            ''
            'Local disks:'
            ($disks | Format-Table -AutoSize | Out-String -Width 160)
            'Network access: private Tailscale overlay only; no public SSH/VNC port forwarding.'
            'This is an ephemeral GitHub-hosted CI machine; it is discarded after the job ends.'
          )
          $report | Tee-Object -FilePath (Join-Path $reportDir 'runner-report.txt')
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          use-cache: "false"

      - name: Enable Windows OpenSSH Server
        shell: pwsh
        env:
          REMOTE_PASSWORD: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $capabilityName = 'OpenSSH.Server~~~~0.0.1.0'
          $capability = Get-WindowsCapability -Online -Name $capabilityName
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capabilityName | Out-Null
          }

          $remoteUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name.Split([char]92)[-1]
          $localUser = Get-LocalUser -Name $remoteUser -ErrorAction Stop
          $securePassword = ConvertTo-SecureString $env:REMOTE_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name $remoteUser -Password $securePassword
          if (-not $localUser.Enabled) { Enable-LocalUser -Name $remoteUser }

          $configPath = Join-Path $env:ProgramData 'ssh\sshd_config'
          if (-not (Test-Path $configPath)) { throw "OpenSSH config was not created: $configPath" }
          $config = Get-Content -LiteralPath $configPath -Raw
          $match = [regex]::Match($config, '(?im)^[ \t]*Match[ \t]+')
          if ($match.Success) {
            $prefix = $config.Substring(0, $match.Index)
            $suffix = $config.Substring($match.Index)
          } else {
            $prefix = $config
            $suffix = ''
          }
          $passwordAuthPattern = '(?im)^[ \t]*#?[ \t]*PasswordAuthentication[ \t]+\S+.*$'
          if ([regex]::IsMatch($prefix, $passwordAuthPattern)) {
            $prefix = [regex]::Replace($prefix, $passwordAuthPattern, 'PasswordAuthentication yes')
          } else {
            $prefix = $prefix.TrimEnd() + [Environment]::NewLine + 'PasswordAuthentication yes' + [Environment]::NewLine
          }
          Set-Content -LiteralPath $configPath -Value ($prefix + $suffix) -Encoding ascii

          # Disable the broad default SSH rule; allow only traffic from Tailscale IPv4.
          Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue | Disable-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName 'SSH via Tailscale only' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'SSH via Tailscale only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 22 -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          Set-Service -Name sshd -StartupType Automatic
          if ((Get-Service -Name sshd).Status -eq 'Running') {
            Restart-Service -Name sshd -Force
          } else {
            Start-Service -Name sshd
          }
          $sshReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Get-NetTCPConnection -State Listen -LocalPort 22 -ErrorAction SilentlyContinue) {
              $sshReady = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $sshReady) { throw 'OpenSSH did not start listening on TCP port 22.' }
          "SSH configured for $remoteUser on TCP 22; firewall limited to Tailscale IPv4." |
            Tee-Object -FilePath (Join-Path $env:REPORT_DIR 'remote-access.txt')

      - name: Install and configure TightVNC Server
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.8.90'
          $msi = Join-Path $env:RUNNER_TEMP "tightvnc-$version-x64.msi"
          $uri = "https://www.tightvnc.com/download/$version/tightvnc-$version-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $uri -OutFile $msi
          $signature = Get-AuthenticodeSignature -FilePath $msi
          Write-Host "TightVNC installer signature status: $($signature.Status)"

          $vncPassword = $env:VNC_PASSWORD
          $arguments = @(
            '/i', $msi, '/quiet', '/norestart',
            'ADDLOCAL=Server',
            'SERVER_REGISTER_AS_SERVICE=1',
            'SERVER_ADD_FIREWALL_EXCEPTION=0',
            'SET_USEVNCAUTHENTICATION=1',
            'VALUE_OF_USEVNCAUTHENTICATION=1',
            'SET_PASSWORD=1',
            "VALUE_OF_PASSWORD=$vncPassword",
            'SET_USECONTROLAUTHENTICATION=1',
            'VALUE_OF_USECONTROLAUTHENTICATION=1',
            'SET_CONTROLPASSWORD=1',
            "VALUE_OF_CONTROLPASSWORD=$vncPassword"
          )
          $installer = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($installer.ExitCode -notin @(0, 3010)) {
            throw "TightVNC MSI installation failed with exit code $($installer.ExitCode)."
          }

          $service = Get-Service | Where-Object {
            $_.Name -eq 'tvnserver' -or $_.DisplayName -like 'TightVNC Server*'
          } | Select-Object -First 1
          if (-not $service) { throw 'TightVNC Server service was not installed.' }

          # Disable installer-created firewall exceptions, then allow VNC only from Tailscale IPv4.
          Get-NetFirewallRule -DisplayName '*TightVNC*' -ErrorAction SilentlyContinue | Disable-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName 'VNC via Tailscale only' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'VNC via Tailscale only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 5900 -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          Set-Service -Name $service.Name -StartupType Automatic
          if ((Get-Service -Name $service.Name).Status -eq 'Running') {
            Restart-Service -Name $service.Name -Force
          } else {
            Start-Service -Name $service.Name
          }
          $vncReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Get-NetTCPConnection -State Listen -LocalPort 5900 -ErrorAction SilentlyContinue) {
              $vncReady = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $vncReady) { throw 'TightVNC did not start listening on TCP port 5900.' }
          'VNC configured on TCP 5900; firewall limited to Tailscale IPv4.' |
            Tee-Object -FilePath (Join-Path $env:REPORT_DIR 'remote-access.txt') -Append

      - name: Publish private connection details
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscaleCommand = Get-Command tailscale.exe -ErrorAction SilentlyContinue
          if ($tailscaleCommand) {
            $tailscalePath = $tailscaleCommand.Source
          } else {
            $tailscalePath = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          }
          if (-not (Test-Path $tailscalePath)) { throw 'Cannot locate tailscale.exe to report its private IPv4 address.' }
          $tailnetIp = (& $tailscalePath ip -4 | Where-Object { $_ -match '^100\.' } | Select-Object -First 1)
          if (-not $tailnetIp) { throw 'Tailscale did not report a 100.x IPv4 address.' }
          $tailnetIp = $tailnetIp.Trim()
          $remoteUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name.Split([char]92)[-1]

          $lines = @(
            ''
            '## Private SSH + VNC access'
            ''
            '- Tailscale IPv4: ' + $tailnetIp
            '- SSH: ssh ' + $remoteUser + '@' + $tailnetIp + ' (TCP 22)'
            '- VNC viewer address: ' + $tailnetIp + ':5900'
            '- Windows username: ' + $remoteUser
            '- SSH password: GitHub Actions secret REMOTE_PASSWORD'
            '- VNC password: GitHub Actions secret VNC_PASSWORD'
            '- Connect your client device to the same Tailscale network first.'
            '- Access is restricted to Tailscale IPv4; no public SSH/VNC tunnel is opened.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines | Out-File -FilePath (Join-Path $env:REPORT_DIR 'remote-access.txt') -Append -Encoding utf8
          Write-Host "Private Tailscale IPv4: $tailnetIp"
          Write-Host "SSH account: $remoteUser"
          Write-Host 'Connection passwords are intentionally not printed.'

      - name: Keep the session active with periodic heartbeats
        id: session
        shell: pwsh
        timeout-minutes: 355
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionMinutes = 0
          $heartbeatMinutes = 0
          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$sessionMinutes)) {
            throw 'session_minutes must be an integer.'
          }
          if (-not [int]::TryParse($env:HEARTBEAT_MINUTES, [ref]$heartbeatMinutes)) {
            throw 'heartbeat_minutes must be an integer.'
          }
          if ($sessionMinutes -lt 1 -or $sessionMinutes -gt 350) {
            throw 'session_minutes must be between 1 and 350 to leave time for final reporting before the 360-minute job timeout.'
          }
          if ($heartbeatMinutes -notin @(1, 5, 10, 15)) {
            throw 'heartbeat_minutes must be one of 1, 5, 10, or 15.'
          }

          $log = Join-Path $env:REPORT_DIR 'heartbeat.log'
          $started = [DateTime]::UtcNow
          $deadline = $started.AddMinutes($sessionMinutes)
          "Started UTC=$($started.ToString('o')); target minutes=$sessionMinutes; heartbeat minutes=$heartbeatMinutes" |
            Tee-Object -FilePath $log
          "Session target: $sessionMinutes minutes. The job hard timeout is 360 minutes." |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          while ($true) {
            $remaining = [int][Math]::Ceiling(($deadline - [DateTime]::UtcNow).TotalSeconds)
            if ($remaining -le 0) { break }
            $sleepSeconds = [int][Math]::Min($heartbeatMinutes * 60, $remaining)
            Start-Sleep -Seconds $sleepSeconds
            $now = [DateTime]::UtcNow
            $remainingMinutes = [Math]::Max(0, [Math]::Ceiling(($deadline - $now).TotalMinutes))
            $line = "Heartbeat UTC=$($now.ToString('o')); remaining_minutes=$remainingMinutes"
            Add-Content -Path $log -Value $line -Encoding utf8
            Write-Host $line
          }

          $ended = [DateTime]::UtcNow
          "Ended UTC=$($ended.ToString('o')); elapsed_minutes=$([Math]::Round(($ended - $started).TotalMinutes, 2))" |
            Tee-Object -FilePath $log -Append
          @(
            ''
            '## Session completed'
            "- Started: $($started.ToString('yyyy-MM-dd HH:mm:ssZ'))"
            "- Ended: $($ended.ToString('yyyy-MM-dd HH:mm:ssZ'))"
            "- Requested duration: $sessionMinutes minutes"
            "- Heartbeat interval: $heartbeatMinutes minutes"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload session diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-2022-session-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-2022-session/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1
